<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Đã thêm thẻ xác minh Monetag tại đây -->
    <meta name="monetag" content="6f470e6dc0c56b2f171a866efe03bcc0">
    
    <title id="pageTitle">Hanimerachel</title>
    <!-- Favicon displays icon on browser tab -->
    <link rel="icon" id="siteFavicon" href="https://via.placeholder.com/36">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ... Các style của bạn giữ nguyên không đổi ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            min-height: 100vh;
        }

        .navbar {
            background-color: #0f172a;
            padding: 12px 24px;
            border-bottom: 1px solid #1e293b;
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .logo-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #38bdf8;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
        }

        .blue-text { color: #38bdf8; }
        .orange-text { color: #ff6b35; }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 16px 9px 40px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            color: #cbd5e1;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 13px;
        }

        .support-btn {
            background-color: #ff6b4a;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .support-btn:hover {
            opacity: 0.9;
        }

        .admin-panel {
            display: none;
            background-color: #0f172a;
            border-bottom: 2px solid #38bdf8;
            padding: 20px 24px;
        }

        .admin-panel-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .admin-panel-header h3 {
            color: #38bdf8;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-section-title {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn {
            background-color: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .admin-divider {
            border: none;
            border-top: 1px dashed #334155;
            margin: 20px 0;
        }

        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-form-group label {
            font-size: 13px;
            color: #94a3b8;
        }

        .admin-form-group input {
            padding: 9px 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .file-input {
            padding: 6px !important;
            cursor: pointer;
        }

        .publish-btn {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .update-logo-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        .main-content {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
        }

        .section-title h2 {
            color: #38bdf8;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider {
            border: none;
            height: 1px;
            background-color: #1e293b;
            margin: 14px 0 24px 0;
        }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .manga-card {
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            width: 180px;
            cursor: pointer;
            position: relative;
        }

        .card-thumb {
            position: relative;
            width: 100%;
            height: 220px;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .pages-badge {
            top: 8px;
            right: 8px;
            background-color: #38bdf8;
            color: #0f172a;
        }

        .card-details {
            padding: 12px;
        }

        .manga-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .chapter-link {
            font-size: 13px;
            color: #38bdf8;
        }

        .views-count {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .delete-btn {
            display: none;
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: #ef4444;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        body.is-admin .delete-btn {
            display: block;
        }

        .reader-view {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .reader-view.active {
            display: block;
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #0f172a;
            padding: 15px 20px;
            border-radius: 8px;
        }

        .back-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .reader-images img {
            width: 100%;
            max-width: 100%;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .admin-modal.active {
            display: flex;
        }

        .admin-box {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .admin-box h3 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .admin-login-btn {
            width: 100%;
            background-color: #ff6b4a;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-modal-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo" onclick="showMainList();">
                <img src="https://via.placeholder.com/36" alt="Avatar" class="logo-img" id="siteLogoImg">
                <span class="logo-text" id="siteLogoText"><span class="blue-text">Hanime</span><span class="orange-text">rachel</span></span>
            </a>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search manga by title..." oninput="filterManga()">
            </div>

            <a href="https://www.patreon.com/cw/rachelanimation" target="_blank" rel="noopener noreferrer" class="support-btn">Support me</a>
        </div>
    </header>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-panel-container">
            <div class="admin-panel-header">
                <h3><i class="fa-solid fa-sliders"></i> ADMIN CONTROL PANEL</h3>
                <button class="logout-btn" onclick="logoutAdmin()">Admin Logout</button>
            </div>

            <div class="admin-section-title"><i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD NEW MANGA</div>
            <form id="uploadMangaForm" class="admin-form-grid">
                <div class="admin-form-group">
                    <label for="mangaTitle">Manga Title</label>
                    <input type="text" id="mangaTitle" placeholder="Enter manga title..." required>
                </div>
                <div class="admin-form-group">
                    <label for="chapterName">Chapter Name</label>
                    <input type="text" id="chapterName" placeholder="e.g., Chapter 1" required>
                </div>
                <div class="admin-form-group">
                    <label for="mangaFiles">Select images from computer</label>
                    <input type="file" id="mangaFiles" class="file-input" accept="image/*" multiple required>
                </div>
                <button type="submit" class="publish-btn" id="submitBtn"><i class="fa-solid fa-upload"></i> Publish Manga</button>
            </form>

            <hr class="admin-divider">

            <div class="admin-section-title"><i class="fa-solid fa-pen-to-square"></i> CHANGE LOGO & WEBSITE NAME</div>
            <form id="updateLogoForm" class="admin-form-grid">
                <div class="admin-form-group">
                    <label for="newLogoText1">First Word (Blue)</label>
                    <input type="text" id="newLogoText1" placeholder="e.g., Hanime">
                </div>
                <div class="admin-form-group">
                    <label for="newLogoText2">Second Word (Orange)</label>
                    <input type="text" id="newLogoText2" placeholder="e.g., rachel">
                </div>
                <div class="admin-form-group">
                    <label for="newLogoFile">Select new Logo image (Also Tab icon)</label>
                    <input type="file" id="newLogoFile" class="file-input" accept="image/*">
                </div>
                <button type="submit" class="update-logo-btn" id="updateLogoBtn"><i class="fa-solid fa-floppy-disk"></i> Update Logo</button>
            </form>
        </div>
    </div>

    <main class="main-content">
        <div id="mangaListView">
            <div class="section-title">
                <h2><i class="fa-solid fa-fire icon-fire"></i> LATEST ONLINE UPDATES</h2>
            </div>
            <hr class="divider">
            <div class="manga-grid" id="mangaGrid"></div>
        </div>

        <div class="reader-view" id="readerView">
            <div class="reader-header">
                <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>
                <h3 id="readerTitle" style="color: #38bdf8;">Manga Title</h3>
            </div>
            <div class="reader-images" id="readerImages"></div>
        </div>
    </main>

    <div class="admin-modal" id="adminModal">
        <div class="admin-box">
            <button class="close-modal-btn" onclick="closeAdminModal()">&times;</button>
            <h3><i class="fa-solid fa-user-shield"></i> Admin Login</h3>
            <form id="adminLoginForm">
                <div class="input-group">
                    <label for="adminUsername">Username</label>
                    <input type="text" id="adminUsername" required placeholder="Enter admin username...">
                </div>
                <div class="input-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required placeholder="Enter password...">
                </div>
                <button type="submit" class="admin-login-btn">Login</button>
                <div class="error-message" id="loginError">Incorrect username or password!</div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const IMGBB_API_KEY = "88a380e9dcc9dde48c74d059183af11b";

        const firebaseConfig = {
            apiKey: "AIzaSyCoT5juzr15S9u8rkqZbkPr0eiy6FWv1nI",
            authDomain: "hanimerachel-d80b2.firebaseapp.com",
            projectId: "hanimerachel-d80b2",
            storageBucket: "hanimerachel-d80b2.firebasestorage.app",
            messagingSenderId: "482175668836",
            appId: "1:482175668836:web:7b5964bbd3cdf1b5e0c571",
            measurementId: "G-PF1V3ZYHLW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const adminModal = document.getElementById('adminModal');
        const adminLoginForm = document.getElementById('adminLoginForm');
        const loginError = document.getElementById('loginError');
        const adminPanel = document.getElementById('adminPanel');
        const uploadMangaForm = document.getElementById('uploadMangaForm');
        const updateLogoForm = document.getElementById('updateLogoForm');
        const mangaGrid = document.getElementById('mangaGrid');
        const mangaListView = document.getElementById('mangaListView');
        const readerView = document.getElementById('readerView');
        const readerTitle = document.getElementById('readerTitle');
        const readerImages = document.getElementById('readerImages');
        const submitBtn = document.getElementById('submitBtn');
        const updateLogoBtn = document.getElementById('updateLogoBtn');

        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error("Lỗi tải ảnh lên ImgBB");
            }
        }

        async function loadSavedLogo() {
            try {
                const docRef = doc(db, "settings", "siteConfig");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.logoImg) {
                        document.getElementById('siteLogoImg').src = data.logoImg;
                        document.getElementById('siteFavicon').href = data.logoImg;
                    }
                    const t1 = data.logoText1 !== undefined ? data.logoText1 : 'Hanime';
                    const t2 = data.logoText2 !== undefined ? data.logoText2 : 'rachel';
                    document.getElementById('siteLogoText').innerHTML = `<span class="blue-text">${t1}</span><span class="orange-text">${t2}</span>`;
                    document.title = `${t1}${t2}`;
                }
            } catch (e) {
                console.error("Lỗi tải Logo:", e);
            }
        }

        updateLogoForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text1 = document.getElementById('newLogoText1').value.trim();
            const text2 = document.getElementById('newLogoText2').value.trim();
            const logoFile = document.getElementById('newLogoFile').files[0];

            updateLogoBtn.disabled = true;
            updateLogoBtn.textContent = 'Saving...';

            try {
                let logoUrl = null;
                if (logoFile) {
                    logoUrl = await uploadToImgBB(logoFile);
                }

                const updateData = {};
                if (text1 !== "") updateData.logoText1 = text1;
                if (text2 !== "") updateData.logoText2 = text2;
                if (logoUrl) updateData.logoImg = logoUrl;

                await setDoc(doc(db, "settings", "siteConfig"), updateData, { merge: true });

                loadSavedLogo();
                updateLogoForm.reset();
                alert('Logo, Title, and Tab Favicon have been updated!');
            } catch (err) {
                alert('Có lỗi xảy ra khi cập nhật Logo!');
            } finally {
                updateLogoBtn.disabled = false;
                updateLogoBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Update Logo';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                e.preventDefault();
                openAdminModal();
            }
        });

        window.openAdminModal = function() {
            adminModal.classList.add('active');
            document.getElementById('adminUsername').focus();
        };

        window.closeAdminModal = function() {
            adminModal.classList.remove('active');
            loginError.style.display = 'none';
            adminLoginForm.reset();
        };

        adminModal.addEventListener('click', function(e) {
            if (e.target === adminModal) closeAdminModal();
        });

        adminLoginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('adminUsername').value.trim();
            const passwordInput = document.getElementById('adminPassword').value;

            if (usernameInput === "adminrachelgardner" && passwordInput === "1234567890!@#$%^&*()") {
                closeAdminModal();
                adminPanel.style.display = 'block';
                document.body.classList.add('is-admin');
            } else {
                loginError.style.display = 'block';
            }
        });

        window.logoutAdmin = function() {
            adminPanel.style.display = 'none';
            document.body.classList.remove('is-admin');
        };

        uploadMangaForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('mangaTitle').value;
            const chapter = document.getElementById('chapterName').value;
            const files = document.getElementById('mangaFiles').files;

            if (files.length === 0) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading images...';

            try {
                const imageUrls = [];
                for (let i = 0; i < files.length; i++) {
                    const url = await uploadToImgBB(files[i]);
                    imageUrls.push(url);
                }

                await addDoc(collection(db, "mangas"), {
                    title: title,
                    chapter: chapter,
                    images: imageUrls,
                    views: 0, 
                    createdAt: new Date()
                });

                uploadMangaForm.reset();
                renderMangaList();
                alert('Manga published successfully!');
            } catch (err) {
                alert('Có lỗi xảy ra khi tải truyện lên!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Publish Manga';
            }
        });

        async function renderMangaList() {
            mangaGrid.innerHTML = '<p style="color: #64748b;">Loading manga list...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "mangas"));
                mangaGrid.innerHTML = '';

                if (querySnapshot.empty) {
                    mangaGrid.innerHTML = '<p style="color: #64748b;">No manga uploaded yet...</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const manga = docSnap.data();
                    const mangaId = docSnap.id;
                    const views = manga.views || 0; 

                    const mangaCard = document.createElement('div');
                    mangaCard.className = 'manga-card';
                    mangaCard.innerHTML = `
                        <button class="delete-btn" title="Delete manga" onclick="deleteManga(event, '${mangaId}')">&times;</button>
                        <div class="card-thumb">
                            <img src="${manga.images[0]}" alt="${manga.title}">
                            <span class="badge pages-badge">${manga.images.length} pages</span>
                        </div>
                        <div class="card-details">
                            <h3 class="manga-title">${manga.title}</h3>
                            <div class="card-footer">
                                <span class="chapter-link">${manga.chapter}</span>
                                <span class="views-count"><i class="fa-regular fa-eye"></i> ${views}</span>
                            </div>
                        </div>
                    `;

                    mangaCard.addEventListener('click', function(e) {
                        if (!e.target.classList.contains('delete-btn')) {
                            openComicReader(mangaId, manga.title, manga.chapter, manga.images);
                        }
                    });

                    mangaGrid.appendChild(mangaCard);
                });

                filterManga();
            } catch (err) {
                console.error("Lỗi lấy danh sách truyện:", err);
            }
        }

        window.deleteManga = async function(event, id) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this manga?')) {
                try {
                    await deleteDoc(doc(db, "mangas", id));
                    renderMangaList();
                } catch (e) {
                    alert('Lỗi khi xóa truyện!');
                }
            }
        };

        window.filterManga = function() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (keyword.length > 0 && readerView.classList.contains('active')) {
                showMainList();
            }

            const cards = document.querySelectorAll('.manga-card');
            let matchedCount = 0;

            cards.forEach(card => {
                const title = card.querySelector('.manga-title').textContent.toLowerCase();
                const chapter = card.querySelector('.chapter-link').textContent.toLowerCase();

                if (title.includes(keyword) || chapter.includes(keyword)) {
                    card.style.display = 'block';
                    matchedCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            let noResultMsg = document.getElementById('noSearchResult');
            if (matchedCount === 0 && cards.length > 0 && keyword !== "") {
                if (!noResultMsg) {
                    noResultMsg = document.createElement('p');
                    noResultMsg.id = 'noSearchResult';
                    noResultMsg.style.color = '#64748b';
                    noResultMsg.style.gridColumn = '1 / -1';
                    noResultMsg.style.textAlign = 'center';
                    noResultMsg.style.padding = '20px 0';
                    mangaGrid.appendChild(noResultMsg);
                }
                noResultMsg.textContent = `No manga found matching key word "${keyword}"`;
                noResultMsg.style.display = 'block';
            } else if (noResultMsg) {
                noResultMsg.style.display = 'none';
            }
        };

        window.openComicReader = async function(id, title, chapter, imageUrls) {
            try {
                const mangaRef = doc(db, "mangas", id);
                await updateDoc(mangaRef, {
                    views: increment(1)
                });
            } catch (err) {
                console.error("Lỗi tăng lượt xem:", err);
            }

            mangaListView.style.display = 'none';
            readerView.classList.add('active');
            readerTitle.textContent = `${title} - ${chapter}`;
            readerImages.innerHTML = '';

            imageUrls.forEach((url) => {
                const img = document.createElement('img');
                img.src = url;
                readerImages.appendChild(img);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });

            history.pushState({ view: 'reader' }, '');
        };

        window.showMainList = function() {
            readerView.classList.remove('active');
            mangaListView.style.display = 'block';
            renderMangaList(); 
        };

        window.goBack = function() {
            history.back();
        };

        window.addEventListener('popstate', function(e) {
            if (readerView.classList.contains('active')) {
                showMainList();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedLogo();
            renderMangaList();
        });
    </script>
</body>
</html>
